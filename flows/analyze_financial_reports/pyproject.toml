[project]
name = "analyze-financial-reports"
version = "0.1.0"
description = "AI-powered financial report generation and analysis using CrewAI flows"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "crewai[tools]>=1.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
